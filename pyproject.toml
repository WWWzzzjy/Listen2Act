[build-system]
requires = ["setuptools==70.2.0", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simvoicevla"
version = "0.1.0"
description = "Simulation-based bilingual Vision-Language-Action training on LIBERO with Chinese voice demo support."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "SimVoiceVLA Contributors" }]
dependencies = [
  "torch==2.3.1",
  "torchvision==0.18.1",
  "torchaudio==2.3.1",
  "transformers==4.41.2",
  "huggingface-hub==0.23.4",
  "accelerate==0.31.0",
  "peft==0.11.1",
  "safetensors==0.4.3",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "numpy==1.26.4",
  "h5py==3.11.0",
  "Pillow==10.4.0",
  "opencv-python-headless==4.10.0.84",
  "mujoco==3.2.0",
  "robosuite==1.4.1",
  "bddl==1.0.1",
  "cloudpickle==2.1.0",
  "easydict==1.9",
  "future==0.18.2",
  "gym==0.25.2",
  "gymnasium==0.29.1",
  "imageio==2.34.2",
  "imageio-ffmpeg==0.5.1",
  "tqdm==4.66.4",
  "wandb==0.17.4",
  "scipy==1.14.0",
  "einops==0.8.0",
  "psutil==6.0.0",
  "soundfile==0.12.1",
  "openai-whisper==20231117",
  "moviepy==1.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "ruff==0.5.0",
]

[tool.setuptools]
packages = [
  "src",
  "src.data",
  "src.models",
  "src.training",
  "src.envs",
  "src.eval",
  "src.inference",
  "src.demo",
  "src.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
